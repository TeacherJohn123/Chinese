<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文華國小五年級 - 國字字形線上特訓</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <div class="max-w-xl mx-auto p-6 w-full mt-10">
        <header class="text-center mb-6">
            <h1 class="text-xl font-bold text-indigo-600">🏫 文華國小五年級國語文競賽特訓</h1>
            <p class="text-xs text-slate-500 mt-1">甲部：字形辨正選擇練習</p>
        </header>

        <!-- 測驗主卡片 -->
        <div id="quiz-card" class="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-slate-200">
            <div class="flex justify-between text-xs font-semibold text-slate-400 mb-4">
                <span id="question-progress">題目 1 / 3</span>
                <span id="question-category" class="bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded">字形辨正</span>
            </div>
            
            <h2 id="question-title" class="text-base font-bold mb-6 text-slate-700">載入中...</h2>
            
            <div id="options-container" class="space-y-3">
                <!-- 選項按鈕會透過 JS 動態產生 -->
            </div>

            <div id="result-feedback" class="mt-4 hidden p-3 rounded-xl text-sm"></div>
        </div>

        <!-- 下一題按鈕 -->
        <div class="flex justify-end">
            <button id="next-btn" onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-medium hidden shadow-md transition">
                下一題 ➔
            </button>
        </div>
    </div>

    <script>
        // 模擬從圖片二（甲部國字）萃取出的字形選擇題題庫
        const quizData = [
            {
                category: "字形辨正（國字）",
                question: "請選出用字完全正確的詞語：「車輛行駛在高速公路上，應保持安全距（　）。」",
                options: ["離", "離 (注意部首)", "離 (其他錯字)", "離 (其他錯字)"], // 實務上選項會放不同國字選項
                // 為了方便示範，我們設計標準的國字選項：
                options: ["離", "籬", "灕", "蘺"],
                answer: 0,
                explanation: "「距離」的「離」正確寫法為部首「隹」部，切勿與「籬（竹籬）」搞混。"
            },
            {
                category: "字形辨正（國字）",
                question: "下列各組詞語「ㄊㄨˊ」的用字，哪一個完全正確？",
                options: ["徒勞無功", "塗勞無功", "途勞無功", "徒勞無工"],
                answer: 0,
                explanation: "「徒勞無功」指白白付出勞力而沒有功效，正確用字為「徒」。"
            },
            {
                category: "字形辨正（國字）",
                question: "「（　）而不捨」的正確國字為何？",
                options: ["契", "鍥", "楔", "絜"],
                answer: 1,
                explanation: "「鍥而不捨」比喻做事有恆心，堅持到底。注意「鍥」為金字旁。"
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const q = quizData[currentIdx];
            document.getElementById('question-progress').innerText = `題目 ${currentIdx + 1} / ${quizData.length}`;
            document.getElementById('question-category').innerText = q.category;
            document.getElementById('question-title').innerText = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 transition text-slate-700 font-medium text-sm flex items-center";
                btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs flex items-center justify-center mr-3 font-bold">${String.fromCharCode(65 + idx)}</span> ${opt}`;
                btn.onclick = () => selectOption(idx);
                container.appendChild(btn);
            });

            document.getElementById('result-feedback').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(selectedIdx) {
            if (answered) return;
            answered = true;

            const q = quizData[currentIdx];
            const feedback = document.getElementById('result-feedback');
            feedback.classList.remove('hidden');

            if (selectedIdx === q.answer) {
                feedback.className = "mt-4 p-3 rounded-xl text-sm bg-emerald-50 text-emerald-700 border border-emerald-200";
                feedback.innerHTML = `<strong>✨ 答對了！</strong> ${q.explanation}`;
                score++;
            } else {
                feedback.className = "mt-4 p-3 rounded-xl text-sm bg-rose-50 text-rose-700 border border-rose-200";
                feedback.innerHTML = `<strong>❌ 答錯了。</strong> 正確答案是 ${String.fromCharCode(65 + q.answer)}。${q.explanation}`;
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-card').innerHTML = `
                    <div class="text-center py-8">
                        <h2 class="text-2xl font-bold text-slate-700 mb-2">🎉 測驗完成！</h2>
                        <p class="text-base text-slate-600 mb-6">你的總得分：<span class="text-indigo-600 font-bold text-xl">${score}</span> / ${quizData.length}</p>
                        <button onclick="location.reload()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-medium shadow-md hover:bg-indigo-700 transition">重新測驗</button>
                    </div>
                `;
                document.getElementById('next-btn').classList.add('hidden');
            }
        }

        loadQuestion();
    </script>
</body>
</html>
