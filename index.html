<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文華國小 - 國語文競賽線上特訓 v5.0 效能秒開版</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-700 text-white shadow-lg py-4 px-6 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-wider flex items-center gap-2">
                    🏆 國語文競賽線上特訓 <span class="text-xs bg-amber-400 text-slate-900 px-2 py-0.5 rounded-full font-bold">v5.0 秒開版</span>
                </h1>
                <p class="text-indigo-200 text-xs mt-1">字音字形特訓系統（含 100-105 年全國賽題庫）</p>
            </div>
            <!-- 主頁籤切換按鈕 -->
            <div class="flex gap-2 items-center">
                <button onclick="switchMainTab('practice')" id="tab-practice" class="px-4 py-2 rounded-xl font-bold bg-white text-indigo-700 shadow-md transition text-sm">📝 題庫練習</button>
                <button onclick="switchMainTab('mistakes')" id="tab-mistakes" class="px-4 py-2 rounded-xl font-bold bg-indigo-800 text-indigo-200 hover:bg-indigo-600 transition text-sm flex items-center gap-1.5">
                    ❌ 錯題本 <span id="mistake-count-badge" class="bg-rose-500 text-white px-1.5 py-0.2 rounded-full text-xs font-black">0</span>
                </button>
                <button onclick="switchMainTab('history')" id="tab-history" class="px-4 py-2 rounded-xl font-bold bg-indigo-800 text-indigo-200 hover:bg-indigo-600 transition text-sm">📊 學習歷程</button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 my-4 flex-grow">

        <!-- ================= 畫面一：題庫練習區 ================= -->
        <div id="view-practice" class="space-y-6">

            <!-- 頂部功能導覽（返回單元與進度） -->
            <div id="quiz-top-bar" class="hidden flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border-2 border-slate-200">
                <button onclick="backToUnitSelection()" id="back-to-units-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl transition text-sm flex items-center gap-1">
                    ⬅ 返回單元列表
                </button>
                <div id="quiz-progress-text" class="font-bold text-slate-600 text-sm">進度：0 / 0</div>
            </div>

            <!-- 1️⃣ 第一層：選擇題庫大分類（校內 vs 全國賽） -->
            <div id="library-selection-card" class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 border-2 border-slate-200 space-y-6">
                <div class="flex justify-between items-center">
                    <div></div>
                    <button onclick="forceRefreshCache()" class="bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 font-bold px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1">
                        🔄 強制重新整理題庫 (清除快取)
                    </button>
                </div>
                <div class="text-center space-y-2">
                    <h2 class="text-2xl font-black text-slate-700">🎯 請選擇練習題庫來源</h2>
                    <p class="text-slate-400 text-sm">您可以選擇基礎校內練習，或挑戰高難度的歷屆全國賽題庫！</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- 校內基礎題庫卡片 -->
                    <button onclick="selectLibrary('base')" class="p-6 rounded-2xl border-4 border-indigo-100 bg-indigo-50/50 hover:bg-indigo-50 hover:border-indigo-400 transition text-left flex flex-col justify-between group shadow-sm">
                        <div>
                            <div class="text-3xl mb-2">📘</div>
                            <div class="text-xl font-black text-indigo-900 group-hover:text-indigo-600">校內基礎特訓題庫</div>
                            <div class="text-sm text-slate-500 mt-1">適合日常單元練習，穩扎穩打建立字音字形基本功。</div>
                        </div>
                        <div class="mt-6 flex items-center gap-2 text-indigo-600 font-bold text-sm">
                            進入練習
