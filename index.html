<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文華國小五年級 - 國語文競賽線上特訓</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <div class="max-w-xl mx-auto p-6 w-full mt-6">
        <header class="text-center mb-6">
            <h1 class="text-xl font-bold text-indigo-600">🏫 文華國小五年級國語文競賽特訓</h1>
            <p class="text-xs text-slate-500 mt-1">雲端題庫即時同步練習網</p>
            
            <!-- 模式切換按鈕 -->
            <div class="flex justify-center gap-3 mt-4">
                <button onclick="changeMode('注音')" id="btn-zhuyin" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow">注音特訓</button>
                <button onclick="changeMode('國字')" id="btn-guazi" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200">國字字形特訓</button>
            </div>
        </header>

        <!-- 載入中狀態 -->
        <div id="loading" class="text-center py-12 text-slate-400">正在從雲端載入題庫中...</div>

        <!-- 測驗主卡片 -->
        <div id="quiz-card" class="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-slate-200 hidden">
            <div class="flex justify-between text-xs font-semibold text-slate-400 mb-4">
                <span id="question-progress">題目 1 / 1</span>
                <!-- 已將錯字「辯」更正為「辨」 -->
                <span id="question-category" class="bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded">字形辨正</span>
            </div>
            
            <h2 id="question-title" class="text-base font-bold mb-6 text-slate-700"></h2>
            
            <div id="options-container" class="space-y-3"></div>

            <div id="result-feedback" class="mt-4 hidden p-3 rounded-xl text-sm"></div>
        </div>

        <!-- 下一題按鈕 -->
        <div class="flex justify-end">
            <button id="next-btn" onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-medium hidden shadow-md transition">
                下一題 ➔
            </button>
        </div>
    </div>

    <script>
        // 您的 Google Apps Script 網址
        const API_URL = "https://script.google.com/macros/s/AKfycby730wJM6SxtCjnu_1abKeIosFmQPNlNDe5znncIpXkHYaBSgTJ9by9KTLvyPQh2Z5QiA/exec";

        let quizData = [];
        let currentIdx = 0;
        let score = 0;
        let answered = false;

        async function changeMode(sheetName) {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            // 切換上方按鈕樣式
            if(sheetName === '注音') {
                document.getElementById('btn-zhuyin').className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow";
                document.getElementById('btn-guazi').className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200";
            } else {
                document.getElementById('btn-guazi').className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow";
                document.getElementById('btn-zhuyin').className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200";
            }

            try {
                const response = await fetch(`${API_URL}?sheet=${sheetName}`);
                quizData = await response.json();
                
                if (quizData.error || quizData.length === 0) {
                    document.getElementById('loading').innerText = "目前該分類沒有題目，請確認 Google 試算表分頁名稱與內容。";
                    return;
                }

                currentIdx = 0;
                score = 0;
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('quiz-card').classList.remove('hidden');
                loadQuestion();
            } catch (error) {
                document.getElementById('loading').innerText = "載入題庫失敗，請檢查網路連線或 Apps Script 部署權限。";
            }
        }

        function loadQuestion() {
            if (quizData.length === 0) return;
            answered = false;
            const q = quizData[currentIdx];
            document.getElementById('question-progress').innerText = `題目 ${currentIdx + 1} / ${quizData.length}`;
            // 優先讀取試算表中的分類，若無則顯示「字形辨正」
            document.getElementById('question-category').innerText = q.category || "字形辨正";
            document.getElementById('question-title').innerText = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                if (!opt) return; 
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 transition text-slate-700 font-medium text-sm flex items-center";
                btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-xs flex items-center justify-center mr-3 font-bold">${String.fromCharCode(65 + idx)}</span> ${opt}`;
                btn.onclick = () => selectOption(idx);
                container.appendChild(btn);
            });

            document.getElementById('result-feedback').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(selectedIdx) {
            if (answered) return;
            answered = true;

            const q = quizData[currentIdx];
            const feedback = document.getElementById('result-feedback');
            feedback.classList.remove('hidden');

            if (selectedIdx === q.answer) {
                feedback.className = "mt-4 p-3 rounded-xl text-sm bg-emerald-50 text-emerald-700 border border-emerald-200";
                feedback.innerHTML = `<strong>✨ 答對了！</strong> ${q.explanation || ''}`;
                score++;
            } else {
                feedback.className = "mt-4 p-3 rounded-xl text-sm bg-rose-50 text-rose-700 border border-rose-200";
                feedback.innerHTML = `<strong>❌ 答錯了。</strong> 正確答案是 ${String.fromCharCode(65 + q.answer)}。${q.explanation || ''}`;
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-card').innerHTML = `
                    <div class="text-center py-8">
                        <h2 class="text-2xl font-bold text-slate-700 mb-2">🎉 測驗完成！</h2>
                        <p class="text-base text-slate-600 mb-6">你的總得分：<span class="text-indigo-600 font-bold text-xl">${score}</span> / ${quizData.length}</p>
                        <button onclick="changeMode('注音')" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-medium shadow-md hover:bg-indigo-700 transition">回到首頁重新測驗</button>
                    </div>
                `;
                document.getElementById('next-btn').classList.add('hidden');
            }
        }

        // 預設載入注音
        changeMode('注音');
    </script>
</body>
</html>
