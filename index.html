// === 1. 在變數宣告區（let isMistakeMode = false; 的下方）加入： ===
let isRandomMode = false;

// === 2. 在 <script> 中加入這些處理 Modal 的新函數 ===
function openRandomQuizModal() {
    const container = document.getElementById('modal-unit-grid');
    container.innerHTML = '';
    
    // 動態產生對應數量的單元 checkbox
    unitsList.forEach((_, idx) => {
        container.innerHTML += `
            <label class="flex items-center gap-2 p-3 border-2 rounded-xl cursor-pointer hover:bg-indigo-50 transition border-slate-200 bg-white">
                <input type="checkbox" class="modal-unit-checkbox w-5 h-5 accent-indigo-600" value="${idx}" onchange="updateRandomQuizUI()">
                <span class="font-bold text-slate-700">第 ${idx + 1} 單元</span>
            </label>
        `;
    });
    
    // 每次開啟預設選擇 25 題
    document.querySelector('input[name="random-count"][value="25"]').checked = true;
    updateRandomQuizUI();
    document.getElementById('random-quiz-modal').classList.remove('hidden');
}

function closeRandomQuizModal() {
    document.getElementById('random-quiz-modal').classList.add('hidden');
}

function updateRandomQuizUI() {
    const checkboxes = document.querySelectorAll('.modal-unit-checkbox:checked');
    const checkedCount = checkboxes.length;
    const btnStart = document.getElementById('btn-start-random');
    const radio100 = document.getElementById('radio-count-100');
    const label100 = document.getElementById('label-count-100');
    const warning = document.getElementById('modal-warning');

    // 判斷 100 題選項是否解鎖 (需 >= 5 個單元)
    if (checkedCount >= 5) {
        radio100.disabled = false;
        label100.classList.remove('text-slate-400');
        label100.classList.add('text-slate-700');
    } else {
        radio100.disabled = true;
        label100.classList.add('text-slate-400');
        label100.classList.remove('text-slate-700');
        // 如果原本選了 100 題但取消勾選單元，自動退回 50 題
        if (radio100.checked) {
            document.querySelector('input[name="random-count"][value="50"]').checked = true;
        }
    }

    // 判斷開始測驗按鈕是否啟用 (需 >= 2 個單元)
    if (checkedCount >= 2) {
        btnStart.disabled = false;
        btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
        btnStart.classList.add('hover:bg-indigo-700');
        
        // 處理警告文字顯示
        if (checkedCount < 5) {
            warning.innerText = "⚠️ 再多勾選幾個單元（滿5個），就能解鎖 100 題大挑戰！";
            warning.classList.remove('text-rose-500');
            warning.classList.add('text-amber-500');
            warning.classList.remove('hidden');
        } else {
            warning.classList.add('hidden');
        }
    } else {
        btnStart.disabled = true;
        btnStart.classList.add('opacity-50', 'cursor-not-allowed');
        btnStart.classList.remove('hover:bg-indigo-700');
        
        warning.innerText = "⚠️ 最少需勾選 2 個單元才能進行隨機測驗";
        warning.classList.remove('text-amber-500');
        warning.classList.add('text-rose-500');
        warning.classList.remove('hidden');
    }
}

function startRandomQuiz() {
    const checkboxes = document.querySelectorAll('.modal-unit-checkbox:checked');
    if (checkboxes.length < 2) return;

    let combinedPool = [];
    // 把勾選的單元題目全部收集起來
    checkboxes.forEach(cb => {
        const unitIdx = parseInt(cb.value);
        combinedPool = combinedPool.concat(unitsList[unitIdx]);
    });

    // 打亂所有題目
    combinedPool = shuffleArray(combinedPool);
    
    // 依據選擇的數量裁切陣列 (如果題庫總數不夠，就全出)
    const selectedCount = parseInt(document.querySelector('input[name="random-count"]:checked').value);
    quizData = combinedPool.slice(0, selectedCount);
    
    // 設定狀態
    isRandomMode = true;
    isMistakeMode = false;
    currentIdx = 0;
    score = 0;

    // 切換畫面
    closeRandomQuizModal();
    document.getElementById('unit-selection-card').classList.add('hidden');
    document.getElementById('quiz-result-card').classList.add('hidden');
    document.getElementById('quiz-card').classList.remove('hidden');
    document.getElementById('back-to-units-btn').classList.remove('hidden');
    
    loadQuestion();
}

// === 4. 修改 nextQuestion() 裡的成績結算紀錄區塊 ===
// 找到 nextQuestion() 裡面的 if (!isMistakeMode) {...} 區塊，替換成這樣：
if (isMistakeMode) {
    saveHistoryToStorage(`錯題特訓複習`, score, quizData.length);
} else if (isRandomMode) {
    saveHistoryToStorage(`${modeTitle} - 隨機綜合測驗 (${quizData.length}題)`, score, quizData.length);
} else {
    saveHistoryToStorage(`${modeTitle} - 第 ${currentUnitIdx + 1} 單元`, score, quizData.length);
}
