<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文華國小五年級 - 國語文競賽線上特訓 v4.0 (自訂隨機測驗版)</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <div class="max-w-3xl mx-auto p-8 w-full mt-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600">🏫 文華國小五年級國語文競賽特訓</h1>
            <p class="text-lg text-slate-500 mt-2">雲端題庫即時同步練習網 v4.0 (自訂隨機測驗版)</p>
            
            <!-- 主導覽按鈕 (模式切換與功能面板) -->
            <div class="flex flex-wrap justify-center gap-3 mt-6">
                <button onclick="switchMainTab('practice')" id="tab-practice" class="px-5 py-2.5 rounded-2xl font-bold bg-indigo-600 text-white shadow-lg transition">線上特訓</button>
                <button onclick="switchMainTab('mistakes')" id="tab-mistakes" class="px-5 py-2.5 rounded-2xl font-bold bg-white text-slate-600 border-2 border-slate-200 shadow-sm transition">📖 錯題本 (<span id="mistake-count">0</span>)</button>
                <button onclick="switchMainTab('history')" id="tab-history" class="px-5 py-2.5 rounded-2xl font-bold bg-white text-slate-600 border-2 border-slate-200 shadow-sm transition">📊 學習歷程</button>
            </div>
        </header>

        <!-- ================= 畫面一：線上特訓（分項選擇與單元闖關） ================= -->
        <div id="view-practice" class="space-y-6">
            <!-- 分類選擇 (注音 / 國字 / 手寫) -->
            <div class="flex justify-center gap-4 flex-wrap">
                <button onclick="changeCategory('注音', false, false)" id="btn-zhuyin" class="px-6 py-3 rounded-2xl text-lg font-bold bg-indigo-600 text-white shadow-lg transition">注音特訓 (選擇題)</button>
                <button onclick="changeCategory('國字', false, false)" id="btn-guazi" class="px-6 py-3 rounded-2xl text-lg font-bold bg-white text-slate-600 border-2 border-slate-200 transition">國字字形 (選擇題)</button>
                <button onclick="changeCategory('國字', false, true)" id="btn-handwriting" class="px-6 py-3 rounded-2xl text-lg font-bold bg-white text-slate-600 border-2 border-slate-200 transition">看注音寫國字 (手寫)</button>
            </div>

            <!-- 載入中狀態 -->
            <div id="loading" class="text-center py-16 text-slate-400 text-xl font-bold">正在從雲端載入題庫中...</div>

            <!-- 單元選擇清單區 -->
            <div id="unit-selection-card" class="bg-white rounded-3xl shadow-xl p-8 border-2 border-slate-200 hidden">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <h3 id="current-category-title" class="text-2xl font-bold text-slate-700">選擇練習單元（每 25 題為一個闖關單元）</h3>
                    <div class="flex gap-2">
                        <!-- 新增的自訂測驗按鈕 -->
                        <button onclick="openRandomQuizModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl transition font-bold shadow flex items-center gap-1">
                            🎲 自訂隨機測驗
                        </button>
                        <button onclick="refreshCategoryCache()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-xl transition font-bold" title="若老師有更新題目可點擊強制重新從雲端載入">
                            🔄 重新整理題庫
                        </button>
                    </div>
                </div>
                <div id="unit-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- 動態產生單元按鈕 -->
                </div>
            </div>

            <!-- 測驗主卡片 -->
            <div id="quiz-card" class="bg-white rounded-3xl shadow-xl p-10 border-2 border-slate-200 hidden">
                <div class="flex justify-between text-lg font-bold text-slate-400 mb-8">
                    <span id="question-progress">題目 1 / 25</span>
                    <span id="question-category" class="bg-indigo-50 text-indigo-600 px-4 py-1.5 rounded-xl text-sm font-bold">字形辨正</span>
                </div>
                
                <!-- 特大題目字體 -->
                <h2 id="question-title" class="text-4xl md:text-5xl font-bold mb-10 text-slate-700 leading-relaxed text-center"></h2>
                
                <!-- 2x2 田字格選項排版 (選擇題模式) -->
                <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

                <!-- 手寫模式專屬區塊 -->
                <div id="handwriting-container" class="hidden flex flex-col items-center gap-6 mt-4">
                    <button id="btn-show-answer" onclick="showAnswer()" class="bg-amber-500 hover:bg-amber-600 text-white px-10 py-5 rounded-2xl font-bold text-2xl shadow-lg transition w-full md:w-auto">
                        🔍 顯示解答，自己對答案
                    </button>

                    <div id="handwriting-answer-area" class="hidden flex flex-col items-center gap-6 w-full">
                        <div class="text-xl text-slate-500 font-bold">正確的國字是：</div>
                        <div id="handwriting-correct-answer" class="text-7xl font-bold text-emerald-600 bg-emerald-50 px-16 py-8 rounded-3xl border-4 border-emerald-200 shadow-inner"></div>

                        <div class="text-lg text-slate-600 mt-4 font-bold">請誠實自評：</div>
                        <div id="handwriting-eval-buttons" class="flex gap-4 w-full justify-center">
                            <button onclick="selfEvaluate(true)" class="flex-1 max-w-[220px] bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-4 rounded-2xl font-bold text-xl shadow-lg transition">✨ 我寫對了</button>
                            <button onclick="selfEvaluate(false)" class="flex-1 max-w-[220px] bg-rose-500 hover:bg-
